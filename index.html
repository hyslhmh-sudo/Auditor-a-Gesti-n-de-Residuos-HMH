:root{
  --navy:#0D313F; --navy-dark:#081E27; --teal:#5894A7; --teal-bg:#EAF3F5;
  --gold:#C9971F; --gold-bg:#FBF3DC;
  --ok:#1E7A3D; --ok-bg:#E6F4EA;
  --bad:#B00020; --bad-bg:#FBE4E4;
  --grey:#6B7280; --line:#D9DEE3; --paper:#F5F7F9; --card:#FFFFFF;
  --ink:#1B2430;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Plus Jakarta Sans',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
.msi{font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal; display:inline-block; line-height:1; vertical-align:middle; -webkit-font-smoothing:antialiased;}

#app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column;}

/* ===== Top bar ===== */
.topbar{position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;}
.logoband{background:#fff; padding:20px 18px; display:flex; align-items:center; border-bottom:1px solid var(--line);}
.logoband img{height:88px; display:block;}
.navband{background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%); padding:20px 18px 22px; position:relative; overflow:hidden;}
.navband::after{content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.05);}
.navband .s{font-size:12px; font-weight:800; letter-spacing:.03em; color:#fff; text-transform:uppercase;}
.navband .s2{font-size:12.5px; color:#8FCBDE; margin-top:2px; font-weight:600;}
.navband h1{font-size:22px; margin:10px 0 3px; color:#fff; font-weight:800; line-height:1.25;}
.navband p{font-size:12.5px; color:#B9C6DE; margin:0;}
.tealstrip{height:5px; background:linear-gradient(90deg, var(--teal), #7BB4C4);}
.topbar .msi{font-size:24px; cursor:pointer; padding:4px;}
.topbar h1{font-size:16px; margin:0; font-weight:800; flex:1; line-height:1.25;}
.topbar .sub{font-size:11px; color:#BFD3DA; font-weight:500;}
.topbar-actions{display:flex; gap:4px;}
.topbar-actions .msi{background:rgba(255,255,255,0.12); border-radius:10px;}

/* ===== Home ===== */
.home-header{padding:20px 18px 10px;}
.home-header .brand{display:flex; align-items:center; gap:8px; color:var(--navy); font-weight:800; font-size:13px; margin-bottom:4px;}
.home-header h1{font-size:22px; margin:2px 0 4px; color:var(--navy);}
.home-header p{font-size:13px; color:var(--grey); margin:0;}

.section-label{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--grey); margin:22px 18px 10px;}

.type-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 18px;}
.type-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 14px; text-align:left; cursor:pointer; transition:transform .1s;}
.type-card:active{transform:scale(0.97);}
.type-card .msi{font-size:26px; margin-bottom:8px; display:block;}
.type-card .t{font-weight:800; font-size:13.5px; line-height:1.25; color:var(--ink);}
.type-card .s{font-size:11px; color:var(--grey); margin-top:3px; line-height:1.3;}

.audit-list{padding:0 18px; display:flex; flex-direction:column; gap:10px;}
.audit-item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; align-items:center; gap:12px; cursor:pointer;}
.audit-item .ic{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.audit-item .ic .msi{font-size:22px; color:#fff;}
.audit-item .body{flex:1; min-width:0;}
.audit-item .body .t{font-weight:700; font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.audit-item .body .s{font-size:11.5px; color:var(--grey); margin-top:2px;}
.audit-item .pct{font-size:15px; font-weight:800; flex-shrink:0;}
.audit-item .del{color:var(--grey); font-size:20px; padding:6px; flex-shrink:0;}
.empty-state{padding:30px 18px; text-align:center; color:var(--grey); font-size:13px;}

/* ===== Form view ===== */
.form-body{padding:16px 16px 100px;}
.intro-box{background:var(--teal-bg); border-left:4px solid var(--teal); border-radius:8px; padding:12px 14px; font-size:12.5px; color:#2b4a53; line-height:1.5; margin-bottom:16px;}

.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
.field{display:flex; flex-direction:column; gap:4px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px; font-weight:700; color:var(--navy);}
.field input, .field select, .field textarea{border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);}
.field textarea{resize:vertical; min-height:60px;}

.tipo-toggle{display:flex; gap:8px; margin:10px 0 16px;}
.tipo-btn{flex:1; padding:11px; border-radius:11px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:13px; text-align:center; color:var(--grey);}
.tipo-btn.active[data-t="P"]{background:var(--teal-bg); border-color:var(--teal); color:var(--navy);}
.tipo-btn.active[data-t="E"]{background:var(--gold-bg); border-color:var(--gold); color:#5a4a18;}

.section-card{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden;}
.section-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;}
.section-head .t{flex:1; font-weight:800; font-size:13.5px; color:var(--navy);}
.section-head .count{font-size:11px; font-weight:700; color:var(--grey); background:var(--paper); padding:3px 8px; border-radius:20px;}
.section-head .chev{color:var(--grey); transition:transform .2s; font-size:20px;}
.section-card.open .chev{transform:rotate(180deg);}
.section-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
.section-card.open .section-body{max-height:4000px;}
.section-note{font-size:11.5px; color:var(--grey); padding:0 14px 10px; margin-top:-4px; line-height:1.4;}

.check-item{padding:12px 14px; border-top:1px solid var(--line);}
.check-item .txt{font-size:12.8px; line-height:1.45; color:var(--ink); margin-bottom:9px;}
.check-pills{display:flex; gap:6px;}
.pill{flex:1; padding:9px 4px; border-radius:9px; border:1.5px solid var(--line); text-align:center; font-size:11.5px; font-weight:700; color:var(--grey); background:#fff;}
.pill.on-ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
.pill.on-bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
.pill.on-na{background:#EEF0F2; border-color:#9AA3AD; color:#5b6570;}
.obs-toggle{font-size:10.5px; color:var(--teal); font-weight:700; margin-top:8px; display:inline-block;}
.obs-input{margin-top:6px; width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:12px; font-family:inherit; display:none;}
.obs-input.show{display:block;}
.fotos-panel{margin-top:6px; display:none;}
.fotos-panel.show{display:block;}

.stat-bar{display:flex; gap:8px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin:18px 0;}
.stat{flex:1; text-align:center;}
.stat .n{font-size:19px; font-weight:800;}
.stat .l{font-size:9.5px; color:var(--grey); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.stat.ok .n{color:var(--ok);} .stat.bad .n{color:var(--bad);} .stat.na .n{color:var(--grey);} .stat.pct .n{color:var(--navy); font-size:22px;}

.personnel-table{width:100%; border-collapse:collapse; font-size:11.5px;}
.personnel-table th{background:var(--navy); color:#fff; padding:7px 6px; text-align:left; font-size:10px;}
.personnel-table td{padding:6px; border-bottom:1px solid var(--line);}
.personnel-table input, .personnel-table select{width:100%; border:none; background:transparent; font-size:11.5px; font-family:inherit; padding:3px;}
.ptable-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; margin-bottom:10px;}
.add-row-btn{display:flex; align-items:center; gap:6px; justify-content:center; padding:10px; border:1.5px dashed var(--line); border-radius:10px; color:var(--teal); font-weight:700; font-size:12.5px; cursor:pointer;}

.deposito-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
.deposito-card .dt{font-weight:800; font-size:12.5px; color:var(--navy);}
.deposito-card .ds{font-size:10.5px; color:var(--grey); margin:2px 0 8px;}
.deposito-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.deposito-grid .fg{display:flex; flex-direction:column; gap:2px;}
.deposito-grid label{font-size:9.5px; font-weight:700; color:var(--grey);}
.deposito-grid input, .deposito-grid select{border:1px solid var(--line); border-radius:7px; padding:6px 7px; font-size:11.5px; font-family:inherit;}

.firma-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
.firma-box .t{font-weight:700; font-size:12px; color:var(--navy); margin-bottom:6px;}

.dyn-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.dyn-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px;}
.dyn-card .row{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px;}
.dyn-card textarea, .dyn-card input, .dyn-card select{width:100%; border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:11.5px; font-family:inherit;}
.dyn-card .rm{text-align:right; margin-top:4px;}
.dyn-card .rm .msi{font-size:16px; color:var(--bad); cursor:pointer;}

.btn{display:flex; align-items:center; justify-content:center; gap:7px; padding:13px; border-radius:12px; font-weight:800; font-size:13.5px; border:none; cursor:pointer; width:100%;}
.btn-primary{background:var(--navy); color:#fff;}
.btn-outline{background:#fff; border:1.5px solid var(--navy); color:var(--navy);}
.bottom-actions{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:6px; z-index:15;}
.bottom-actions .btn{flex:1; padding:11px 4px; font-size:11.5px; gap:4px;}

.ref-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:14px;}
.ref-table th{background:var(--teal); color:#fff; padding:7px 8px; text-align:left; font-size:10.5px;}
.ref-table td{padding:7px 8px; border-bottom:1px solid var(--line);}

.picker-list{padding:10px 18px; display:flex; flex-direction:column; gap:8px;}
.picker-item{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; cursor:pointer;}
.picker-item input{width:17px; height:17px;}
.picker-item .t{flex:1; font-size:12.5px; font-weight:600;}
.picker-item .s{font-size:10.5px; color:var(--grey);}

.toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:24px; font-size:12.5px; font-weight:700; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none;}
.toast.show{opacity:1;}

/* Print view — hidden on screen, shown on print */
#printRoot{display:none;}
@media print {
  @page { size: A4; margin: 15mm 12mm; }
  #app{display:none !important;}
  #printRoot{display:block !important;}
  body{background:#fff;}
  .p-page{padding:0; font-family:'Plus Jakarta Sans',sans-serif; color:#1B2430; font-size:10.5pt; line-height:1.5;}
  .p-header{display:flex; border:1px solid #0D313F; margin-bottom:14px;}
  .p-header .l{padding:8px 12px; flex:1; font-weight:800; font-size:12pt; color:#0D313F; display:flex; align-items:center; line-height:1.2;}
  .p-header table{border-collapse:collapse; font-size:9pt; line-height:1.15;}
  .p-header table td{border:1px solid #0D313F; padding:3px 8px; text-align:left;}
  .p-h1{font-size:16pt; font-weight:800; color:#0D313F; margin:0 0 2px; line-height:1.25;}
  .p-h2{font-size:11pt; color:#5894A7; font-weight:800; margin:14px 0 6px; line-height:1.25;}
  .p-h3{font-size:10pt; color:#0D313F; font-weight:700; margin:10px 0 4px; line-height:1.25;}
  /* Cuerpo de texto (prosa): justificado, interlineado 1.5 */
  .p-meta{font-size:10.5pt; color:#1B2430; margin-bottom:10px; text-align:justify; line-height:1.5;}
  /* Tablas y cuadros: NO justificar, interlineado reducido */
  .p-table{width:100%; border-collapse:collapse; margin-bottom:8px; font-size:9pt; line-height:1.2;}
  .p-table th{background:#0D313F; color:#fff; padding:4px 6px; text-align:left;}
  .p-table td{padding:4px 6px; border:1px solid #D9DEE3; text-align:left; line-height:1.2;}
  .p-fields{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:9.5pt; line-height:1.2; margin-bottom:10px;}
  .p-fields div{text-align:left;}
}
</style>
</head>

<script>
// ============ APP LOGIC — Auditorías de Residuos HMH ============
'use strict';

const ICON_MAP = window.__ICON_MAP__;
function icon(name, extraStyle){ return `<span class="msi" style="${extraStyle||''}">${ICON_MAP[name]||''}</span>`; }

const STORAGE_KEY = 'hmh_auditorias_v1';
const INFORMES_KEY = 'hmh_informes_v1';

function loadAudits(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; } }
function saveAudits(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
// Solo las auditorías CONFIRMADAS (guardadas explícitamente) — para la lista del Inicio y el Informe.
function loadConfirmedAudits(){ return loadAudits().filter(a=>a.confirmed); }
// Borradores: existen y persisten en el celu (sin internet), pero todavía no fueron confirmados.
function loadDraftAudits(){ return loadAudits().filter(a=>!a.confirmed); }
function loadInformes(){ try{ return JSON.parse(localStorage.getItem(INFORMES_KEY)) || []; }catch(e){ return []; } }
function saveInformes(list){ localStorage.setItem(INFORMES_KEY, JSON.stringify(list)); }

function uid(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }

// ---------- Numeración automática de auditorías (por tipo, reinicia cada año) ----------
const COUNTERS_KEY = 'hmh_counters_v1';
function getCounters(){ try{ return JSON.parse(localStorage.getItem(COUNTERS_KEY)) || {}; }catch(e){ return {}; } }
function saveCounters(c){ localStorage.setItem(COUNTERS_KEY, JSON.stringify(c)); }
function nextNumero(type){
  const year = new Date().getFullYear();
  const key = type + '_' + year;
  const counters = getCounters();
  counters[key] = (counters[key] || 0) + 1;
  saveCounters(counters);
  return year + '-' + String(counters[key]).padStart(3, '0');
}

let state = { view:'home', modulo:null, auditId:null, informeId:null, tableroData:null, tableroError:null };

// ---------- Toast ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- New audit skeleton ----------
function newAudit(type){
  const def = FORM_DEFS[type];
  const items = {};
  def.sections.forEach((s,si)=> s.items.forEach((it,ii)=>{ items[si+'_'+ii] = { v:null, obs:'' }; }));
  const audit = {
    id: uid(), type, createdAt: Date.now(), updatedAt: Date.now(),
    confirmed: false, // se pasa a true recién cuando toca "Guardar"
    fields: {}, tipoPersonal: null, items,
    personnel: [],
    depositos: def.depositos ? def.depositos.grupos.flatMap(g=>g.rows.map(r=>({nombre:r.nombre, sectores:r.sectores, planta:g.planta, limpieza:null, horario:null, obs:''}))) : null,
  };
  def.fields.forEach(f=>{
    if(f.key==='fecha') audit.fields[f.key] = todayISO();
    else if(f.key==='horario') audit.fields[f.key] = new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hour12:false});
    else if(f.key==='auditor') audit.fields[f.key] = 'Lic. Belén Pellegrini — MP LCOHSECH0383';
    else if(f.key==='empresa') audit.fields[f.key] = 'Star Union';
    else audit.fields[f.key] = '';
  });
  audit.fields.numero = ''; // se asigna recién al confirmar el guardado, para no saltear números con borradores abandonados
  return audit;
}

function getAudit(id){ return loadAudits().find(a=>a.id===id); }
function upsertAudit(a){
  a.updatedAt = Date.now();
  const list = loadAudits();
  const idx = list.findIndex(x=>x.id===a.id);
  if(idx>=0) list[idx]=a; else list.push(a);
  saveAudits(list);
}
function deleteAudit(id){ saveAudits(loadAudits().filter(a=>a.id!==id)); }

// ---------- Compute results ----------
function computeStats(audit){
  let ok=0, bad=0, na=0;
  Object.values(audit.items).forEach(it=>{
    if(it.v==='ok') ok++; else if(it.v==='bad') bad++; else if(it.v==='na') na++;
  });
  const denom = ok+bad;
  const pct = denom>0 ? Math.round((ok/denom)*100) : null;
  return { ok, bad, na, total: ok+bad+na, pct };
}

async function loadTableroData(){
  try{
    const cfg = await ensureDriveSetup();
    const ranges = ['Resumen!A2:L','Detalle!A2:I','Personal!A2:I','Depositos!A2:I','Fotos!A2:A']
      .map(r=>'ranges='+encodeURIComponent(r)).join('&');
    const res = await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+'/values:batchGet?'+ranges);
    const [resumen, detalle, personal, depositos, fotos] = res.valueRanges.map(r=>r.values||[]);
    state.tableroData = computeTableroStatsFromSheet(resumen, detalle, personal, depositos, fotos);
    state.tableroError = null;
  } catch(e){
    console.error(e);
    state.tableroError = 'No se pudo cargar el tablero — '+(e && e.message ? e.message.slice(0,160) : 'error desconocido');
  }
  if(state.view==='tablero') render({preserveScroll:true});
}

// Calcula los mismos indicadores que la pestaña "Tablero" de Sheets, pero client-side,
// leyendo las filas ya sincronizadas — así el resultado es igual sin importar desde qué
// dispositivo (celular, PC laboral, PC de casa) se esté mirando.
function computeTableroStatsFromSheet(resumen, detalle, personal, depositos, fotos){
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const byEntidad = { 'G':[], 'OPL-P':[], 'OPL-E':[], 'T':[], 'DOC':[] };
  let countG=0, countOplP=0, countOplE=0, countT=0, countDoc=0;
  let totalCumple=0, totalNoCumple=0, totalNA=0;
  resumen.forEach(r=>{
    const entidad = r[2];
    const pct = num(r[10]);
    if(byEntidad[entidad] && pct!==null) byEntidad[entidad].push(pct);
    if(entidad==='G') countG++; else if(entidad==='OPL-P') countOplP++; else if(entidad==='OPL-E') countOplE++; else if(entidad==='T') countT++; else if(entidad==='DOC') countDoc++;
    totalCumple += num(r[7])||0; totalNoCumple += num(r[8])||0; totalNA += num(r[9])||0;
  });
  const avg = arr => arr.length ? Math.round(arr.reduce((s,v)=>s+v,0)/arr.length) : null;
  const allPct = Object.values(byEntidad).flat();

  const itemCounts = {}, seccionCounts = {};
  detalle.forEach(r=>{
    if(r[6]!=='No cumple') return;
    const seccion = r[4], item = r[5];
    itemCounts[item] = (itemCounts[item]||0)+1;
    seccionCounts[seccion] = (seccionCounts[seccion]||0)+1;
  });
  const topItems = Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topSecciones = Object.entries(seccionCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  let personalCapacitado=0, personalP=0, personalE=0;
  personal.forEach(r=>{
    if(r[7]==='Sí') personalCapacitado++;
    if(r[3]==='P') personalP++;
    if(r[3]==='E') personalE++;
  });

  let depLimpiezaNo=0, depHorarioNo=0;
  depositos.forEach(r=>{
    if(r[5]==='No') depLimpiezaNo++;
    if(r[6]==='No') depHorarioNo++;
  });

  return {
    totalAuditorias: resumen.length,
    countG, countOplP, countOplE, countT, countDoc,
    pctGlobal: avg(allPct), pctG: avg(byEntidad['G']), pctOplP: avg(byEntidad['OPL-P']), pctOplE: avg(byEntidad['OPL-E']), pctT: avg(byEntidad['T']), pctDoc: avg(byEntidad['DOC']),
    totalCumple, totalNoCumple, totalNA, topItems, topSecciones,
    personalTotal: personal.length, personalCapacitado, personalP, personalE,
    depTotal: depositos.length, depLimpiezaNo, depHorarioNo,
    fotoTotal: fotos.length,
  };
}

      <div class="tipo-btn ${a.tipoPersonal==='E'?'active':''}" data-t="E" onclick="setTipoPersonal('E')">${icon('trolley',(a.tipoPersonal==='E'?'':'opacity:.5')+';font-size:16px;margin-right:5px')}Empresa tercerizada (E)</div>
    </div>`;

  // Depositos table (trans only) — agrupados por planta, siguiendo el recorrido físico real

    b += `<div class="section-label" style="margin:18px 0 8px">${def.depositos.title}</div>`;

    a.depositos.forEach((dep,di)=>{
      if(dep.planta !== currentPlanta){

      }
      b += `<div class="deposito-card">
        <div class="dt">${dep.nombre}</div>
        <div class="ds">${dep.sectores}</div>
        <div style="margin-top:8px; padding:9px 10px; background:var(--gold-bg); border-left:3px solid var(--gold); border-radius:0 8px 8px 0;">
          <label style="font-size:9.5px; font-weight:800; color:#5A4A18">A CARGO EXCLUSIVO DE STAR UNION — tramo depósito intermedio → depósito externo</label>
          <div class="deposito-grid" style="margin-top:6px">
            <div class="fg"><label>Limpieza depósito</label>
              <select data-dep="${di}" data-dk="limpieza">
                <option value="" ${dep.limpieza===null?'selected':''}>—</option>
                <option value="si" ${dep.limpieza==='si'?'selected':''}>Sí</option>
                <option value="no" ${dep.limpieza==='no'?'selected':''}>No</option>
              </select>
            </div>
            <div class="fg"><label>Traslado a dep. externo cumple horario</label>
              <select data-dep="${di}" data-dk="horario">
                <option value="" ${dep.horario===null?'selected':''}>—</option>
                <option value="si" ${dep.horario==='si'?'selected':''}>Sí</option>
                <option value="no" ${dep.horario==='no'?'selected':''}>No</option>
              </select>
            </div>

          <textarea data-dep="${di}" data-dk="obs" placeholder="Describir hallazgo, si corresponde..." style="width:100%; margin-top:4px; border:1px solid var(--line); border-radius:7px; padding:7px 8px; font-size:11.5px; font-family:inherit; min-height:44px; resize:vertical;">${dep.obs||''}</textarea>
        </div>
        <div style="margin-top:8px">
          <label style="font-size:9.5px; font-weight:700; color:var(--grey)">FOTOS DE ESTE DEPÓSITO</label>
          <div style="margin-top:4px">${renderPhotoMini(a, 'dep:'+di).html}</div>
        </div>
      </div>`;
    });
  }

  // Personnel (se carga antes del checklist para poder usarlo como referencia al responder)
  // Condicional: para auditorías puramente documentales (sin relevamiento de personal en terreno)
  // se puede omitir con personnel:false en la definición del tipo.
  if(def.personnel !== false){
    b += `<div class="section-label" style="margin:18px 0 8px">Personal presente</div>`;
    b += `<div class="intro-box" style="font-size:11px">Cargá primero al personal presente en el sector (podés buscarlo por DNI para autocompletar nombre, función y sector). Vas a poder usar estos datos como referencia al responder el checklist de capacitación, más abajo.</div>`;

function renderPhotosSection(a){
  let html = '';
  if(!a.confirmed){
    html += `<div class="empty-state" style="padding:14px">Guardá la auditoría primero (botón "Guardar") para poder subir fotos.</div>`;
    return html;
  }
  const generalPhotos = (a.photos||[]).map((p,pi)=>({...p,pi})).filter(p=>!p.tag);
  generalPhotos.forEach(p=>{
    html += `<div class="firma-box" style="display:flex; align-items:center; gap:10px; justify-content:space-between">
      <a href="${p.url}" target="_blank" style="display:flex; align-items:center; gap:8px; color:var(--navy); text-decoration:none; font-size:12px; font-weight:700">
        ${icon('cloud_done', 'color:var(--ok)')} Foto — ${new Date(p.ts).toLocaleString('es-AR')} ${icon('open_in_new','font-size:14px')}
      </a>
      <span class="msi" style="font-size:16px; color:var(--bad); cursor:pointer" onclick="removePhoto('${a.id}',${p.pi})">${ICON_MAP.delete}</span>
    </div>`;
  });
  if(generalPhotos.length===0){
    html += `<div class="empty-state" style="padding:14px">Sin fotos generales cargadas todavía. Las fotos de un ítem o depósito puntual se cargan junto a ese ítem, más arriba.</div>`;
  }
  html += `<label class="add-row-btn" style="cursor:pointer">
    ${icon('photo_camera')} Tomar / subir foto
    <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoInput('${a.id}', this)">
  </label>`;
  return html;
}

// ---- Fotos por ítem/depósito (etiquetadas con "tag") ----
// tag: null = general (no asociada a un hallazgo puntual); 'dep:N' = depósito N (solo TRANS); 'item:S_I' = ítem I de la sección S
function photosForTag(a, tag){
  return (a.photos||[]).map((p,pi)=>({...p,pi})).filter(p=>(p.tag||null)===tag);
}
function renderPhotoMini(a, tag){
  const photos = photosForTag(a, tag);
  let html = '';
  photos.forEach(p=>{
    html += `<div class="firma-box" style="display:flex; align-items:center; gap:8px; justify-content:space-between; padding:6px 8px; margin-top:4px;">
      <a href="${p.url}" target="_blank" style="display:flex; align-items:center; gap:6px; color:var(--navy); text-decoration:none; font-size:11px; font-weight:700">
        ${icon('cloud_done','color:var(--ok); font-size:15px')} ${new Date(p.ts).toLocaleString('es-AR')} ${icon('open_in_new','font-size:12px')}
      </a>
      <span class="msi" style="font-size:14px; color:var(--bad); cursor:pointer" onclick="removePhoto('${a.id}',${p.pi})">${ICON_MAP.delete}</span>
    </div>`;
  });
  if(a.confirmed){
    html += `<label class="add-row-btn" style="cursor:pointer; padding:6px 8px; font-size:11px; margin-top:4px;">
      ${icon('photo_camera','font-size:14px')} Tomar / subir foto de este ítem
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoInput('${a.id}', this, '${tag}')">
    </label>`;
  } else {
    html += `<div style="font-size:10px; color:var(--grey); margin-top:4px;">Guardá la auditoría para poder subir fotos.</div>`;

  return { html, count: photos.length };

function toggleFotos(key){

function renderPersonnelTable(a, def){
  const cols = def.personnel.tipo
    ? ['DNI','Tipo','Nombre y Apellido','Función','Sector','Capacitado en Gest. Residuos']
    : ['DNI','Nombre y Apellido','Función','Sector','Capacitado en Gest. Residuos'];
  let html = `<div class="ptable-wrap"><table class="personnel-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>`;
  a.personnel.forEach((p,pi)=>{
    html += '<tr>';
    html += `<td style="white-space:nowrap; display:flex; gap:4px; align-items:center">
      <input data-p="${pi}" data-pk="dni" value="${escAttr(p.dni||'')}" placeholder="DNI" style="width:74px">
      <button type="button" onclick="buscarPorDNI(${pi})" title="Buscar por DNI" style="flex-shrink:0; border:1px solid var(--teal); background:#fff; color:var(--teal); border-radius:6px; padding:4px 7px; font-size:10px; font-weight:700; cursor:pointer; white-space:nowrap">Buscar</button>
    </td>`;
    if(def.personnel.tipo){
      html += `<td><select data-p="${pi}" data-pk="tipo"><option value="" ${!p.tipo?'selected':''}>—</option><option value="P" ${p.tipo==='P'?'selected':''}>P</option><option value="E" ${p.tipo==='E'?'selected':''}>E</option></select></td>`;
    }
    html += `<td><input data-p="${pi}" data-pk="nombre" value="${escAttr(p.nombre||'')}"></td>`;
    html += `<td><input data-p="${pi}" data-pk="funcion" value="${escAttr(p.funcion||'')}"></td>`;
    html += `<td><input data-p="${pi}" data-pk="sector" value="${escAttr(p.sector||'')}"></td>`;
    html += `<td><select data-p="${pi}" data-pk="capacitado"><option value="" ${!p.capacitado?'selected':''}>—</option><option value="si" ${p.capacitado==='si'?'selected':''}>Sí</option><option value="no" ${p.capacitado==='no'?'selected':''}>No</option></select></td>`;
    html += `<td><span class="msi" style="font-size:16px;color:var(--bad)" onclick="removePersonnel(${pi})">${ICON_MAP.delete}</span></td>`;
    html += '</tr>';
  });
  if(a.personnel.length===0){
    html += `<tr><td colspan="${cols.length+1}" style="text-align:center; color:var(--grey); padding:14px">Sin personal cargado</td></tr>`;
  }
  html += '</tbody></table></div>';
  return html;

  rerenderInPlace();

function toggleObs(key){

function setItemVal(key, val){

  a.items[key].v = a.items[key].v===val ? null : val;
  upsertAudit(a);
  rerenderInPlace();
}
function setItemObs(key, val){
  const a = getAudit(state.auditId);
  a.items[key].obs = val;
  upsertAudit(a);
}
function setTipoPersonal(t){

  a.tipoPersonal = a.tipoPersonal===t ? null : t;

function manualSave(id){
  collectFieldInputs();
  const a = getAudit(id);
  const wasConfirmed = a.confirmed;
  if(!a.confirmed){
    a.confirmed = true;
    a.fields.numero = nextNumero(a.type);
    upsertAudit(a);
  }
  toast(wasConfirmed ? 'Cambios guardados ✓' : 'Auditoría guardada y registrada ✓ — N.º ' + a.fields.numero);
  rerenderInPlace();
}
function collectFieldInputs(){
  const a = getAudit(state.auditId);
  if(!a) return;
  document.querySelectorAll('[data-field]').forEach(inp=>{ if(!inp.readOnly) a.fields[inp.dataset.field] = inp.value; });
  document.querySelectorAll('[data-dep]').forEach(inp=>{
    const di = +inp.dataset.dep, dk = inp.dataset.dk;
    a.depositos[di][dk] = inp.value || null;
  });
  document.querySelectorAll('[data-p]').forEach(inp=>{
    const pi = +inp.dataset.p, pk = inp.dataset.pk;
    a.personnel[pi][pk] = inp.value;
  });
  upsertAudit(a);
}

function generarInforme(){
  const desde = document.getElementById('infDesde').value;
  const hasta = document.getElementById('infHasta').value;
  const ids = Array.from(document.querySelectorAll('.aud-check:checked')).map(c=>c.value);

  openInforme(inf.id);

function openInforme(id){ state.view='informe'; state.informeId=id; render(); }

function computeInformeAgg(inf){
  const included = inf.auditIds.map(getAudit).filter(Boolean);
  function aggFor(type, filterFn){
    const defSecs = FORM_DEFS[type].sections;
    const audits = included.filter(a=>a.type===type && (!filterFn || filterFn(a)));
    const rows = defSecs.map(sec=>({title:sec.title, ok:0, bad:0, na:0}));
    audits.forEach(a=>{
      defSecs.forEach((sec,si)=>{
        sec.items.forEach((it,ii)=>{
          const v = a.items[si+'_'+ii].v;
          if(v==='ok') rows[si].ok++; else if(v==='bad') rows[si].bad++; else if(v==='na') rows[si].na++;
        });
      });
    });
    const tot = rows.reduce((acc,r)=>({ok:acc.ok+r.ok, bad:acc.bad+r.bad, na:acc.na+r.na}), {ok:0,bad:0,na:0});
    const pct = (tot.ok+tot.bad)>0 ? Math.round(tot.ok/(tot.ok+tot.bad)*100) : null;
    return { rows, tot, pct, count: audits.length };
  }
  return {
    gen: aggFor('gen'),
    mp: aggFor('opl', a=>a.tipoPersonal==='P'),
    me: aggFor('opl', a=>a.tipoPersonal==='E'),
    trans: aggFor('trans'),
    doc: aggFor('doc'),
    included,
  };
}

function renderInforme(){
  const inf = loadInformes().find(i=>i.id===state.informeId);
  if(!inf){ state.view='home'; render(); return; }
  const agg = computeInformeAgg(inf);

  let html = `<div class="topbar">
    <span class="msi" onclick="goHome()">${ICON_MAP.arrow_back}</span>
    <div><h1>Informe Consolidado</h1><div class="sub">AUD-RES-002 · N.º ${esc(inf.numero||'—')} · ${fmtDate(inf.desde)} – ${fmtDate(inf.hasta)}</div></div>
    <div class="topbar-actions"><span class="msi" onclick="doPrintInforme('${inf.id}')" style="padding:6px;border-radius:9px;background:rgba(255,255,255,.12)">${ICON_MAP.print}</span></div>
  </div>
  <div class="form-body" id="infBody" style="padding-bottom:100px"></div>
  <div class="bottom-actions">
    <button class="btn btn-outline" onclick="goHome()">${icon('home')} Inicio</button>
    <button class="btn btn-primary" onclick="saveInformeFields('${inf.id}')">${icon('save')} Guardar</button>
  </div>`;
  document.getElementById('app').innerHTML = html;

  const b = document.getElementById('infBody');
  let s = '';
  s += `<div class="intro-box">${agg.included.length} auditorías incluidas · Generador: ${agg.gen.count} · Operario Planta: ${agg.mp.count} · Operario Empresa: ${agg.me.count} · Transporte: ${agg.trans.count} · Documental: ${agg.doc.count}</div>`;

  function aggTable(title, a){
    let h = `<div class="section-label" style="margin:16px 0 6px">${title}</div>`;
    h += `<div class="ptable-wrap"><table class="personnel-table"><thead><tr><th>Área</th><th>Cumple</th><th>No cumple</th><th>%</th></tr></thead><tbody>`;
    a.rows.forEach(r=>{
      const p = (r.ok+r.bad)>0 ? Math.round(r.ok/(r.ok+r.bad)*100) : null;
      h += `<tr><td>${r.title}</td><td>${r.ok}</td><td>${r.bad}</td><td>${p===null?'—':p+'%'}</td></tr>`;
    });
    h += `<tr style="font-weight:800"><td>SUBTOTAL</td><td>${a.tot.ok}</td><td>${a.tot.bad}</td><td>${a.pct===null?'—':a.pct+'%'}</td></tr>`;
    h += `</tbody></table></div>`;
    return h;
  }
  s += aggTable('4.1 Generadores', agg.gen);
  s += aggTable('4.2 Operarios de Limpieza — Planta (OPL-P)', agg.mp);
  s += aggTable('4.3 Operarios de Limpieza — Empresa (OPL-E)', agg.me);
  s += aggTable('4.4 Transporte — Empresa', agg.trans);
  s += aggTable('4.5 Auditoría Documental', agg.doc);

  const diff = (agg.mp.pct!==null && agg.me.pct!==null) ? (agg.me.pct-agg.mp.pct) : null;
  s += `<div class="section-label" style="margin:16px 0 6px">4.5 Comparativo Planta vs. Empresa</div>
  <div class="stat-bar">
    <div class="stat"><div class="n" style="color:var(--teal)">${agg.mp.pct===null?'—':agg.mp.pct+'%'}</div><div class="l">OPL-P Planta</div></div>
    <div class="stat"><div class="n" style="color:#C9971F">${agg.me.pct===null?'—':agg.me.pct+'%'}</div><div class="l">OPL-E Empresa</div></div>
    <div class="stat"><div class="n" style="color:${diff>0?'var(--ok)':diff<0?'var(--bad)':'var(--grey)'}">${diff===null?'—':(diff>0?'+':'')+diff+'pp'}</div><div class="l">Diferencia</div></div>
  </div>`;

  // Resumen / fortalezas / conclusion
  s += `<div class="section-label" style="margin:16px 0 8px">Resumen ejecutivo</div>
  <div class="field full"><textarea id="infResumen" placeholder="Síntesis del período...">${esc(inf.resumen)}</textarea></div>`;

  s += `<div class="section-label" style="margin:16px 0 8px">Hallazgos y no conformidades</div>`;
  s += `<div class="dyn-list" id="hallazgosList">` + inf.hallazgos.map((h,i)=>hallazgoCard(h,i)).join('') + `</div>`;
  s += `<div class="add-row-btn" onclick="addHallazgo('${inf.id}')">${icon('add_circle')} Agregar hallazgo</div>`;

  s += `<div class="section-label" style="margin:16px 0 8px">Plan de acción correctivo</div>`;
  s += `<div class="dyn-list" id="planList">` + inf.planAccion.map((p,i)=>planCard(p,i)).join('') + `</div>`;
  s += `<div class="add-row-btn" onclick="addPlan('${inf.id}')">${icon('add_circle')} Agregar acción</div>`;

  s += `<div class="section-label" style="margin:16px 0 8px">Fortalezas identificadas</div>
  <div class="field full"><textarea id="infFortalezas" placeholder="Prácticas o equipos destacados...">${esc(inf.fortalezas)}</textarea></div>`;

  s += `<div class="section-label" style="margin:16px 0 8px">Conclusión general</div>
  <div class="field full"><textarea id="infConclusion" placeholder="Conclusión del período...">${esc(inf.conclusion)}</textarea></div>`;

  b.innerHTML = s;
}

function hallazgoCard(h,i){
  return `<div class="dyn-card">
    <div class="row">
      <select onchange="updHallazgo(${i},'entidad',this.value)">
        ${['G','OPL-P','OPL-E','T'].map(e=>`<option ${h.entidad===e?'selected':''}>${e}</option>`).join('')}
      </select>
      <select onchange="updHallazgo(${i},'clasif',this.value)">
        ${['Leve','Moderada','Grave'].map(c=>`<option ${h.clasif===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <textarea placeholder="Descripción del hallazgo..." onchange="updHallazgo(${i},'desc',this.value)">${esc(h.desc)}</textarea>
    <input placeholder="Referencia normativa / manual" value="${escAttr(h.ref||'')}" onchange="updHallazgo(${i},'ref',this.value)" style="margin-top:6px">
    <div class="rm"><span class="msi" onclick="removeHallazgo(${i})">${ICON_MAP.delete}</span></div>
  </div>`;
}
function planCard(p,i){
  return `<div class="dyn-card">
    <div class="row">
      <select onchange="updPlan(${i},'entidad',this.value)">
        ${['G','OPL-P','OPL-E','T'].map(e=>`<option ${p.entidad===e?'selected':''}>${e}</option>`).join('')}
      </select>
      <input placeholder="Responsable" value="${escAttr(p.responsable||'')}" onchange="updPlan(${i},'responsable',this.value)">
    </div>
    <textarea placeholder="Acción correctiva..." onchange="updPlan(${i},'accion',this.value)">${esc(p.accion)}</textarea>
    <div class="row" style="margin-top:6px">
      <input placeholder="Plazo" value="${escAttr(p.plazo||'')}" onchange="updPlan(${i},'plazo',this.value)">
      <select onchange="updPlan(${i},'estado',this.value)">
        ${['Pendiente','En curso','Cumplido'].map(e=>`<option ${p.estado===e?'selected':''}>${e}</option>`).join('')}
      </select>
    </div>
    <div class="rm"><span class="msi" onclick="removePlan(${i})">${ICON_MAP.delete}</span></div>
  </div>`;
}
function withInforme(fn){
  const list = loadInformes();
  const inf = list.find(i=>i.id===state.informeId);
  fn(inf);
  inf.updatedAt = Date.now();
  saveInformes(list);
}
function addHallazgo(){ withInforme(inf=>inf.hallazgos.push({entidad:'G',clasif:'Leve',desc:'',ref:''})); rerenderInPlace(); }
function removeHallazgo(i){ withInforme(inf=>inf.hallazgos.splice(i,1)); rerenderInPlace(); }
function updHallazgo(i,k,v){ withInforme(inf=>inf.hallazgos[i][k]=v); }
function addPlan(){ withInforme(inf=>inf.planAccion.push({entidad:'G',accion:'',responsable:'',plazo:'',estado:'Pendiente'})); rerenderInPlace(); }
function removePlan(i){ withInforme(inf=>inf.planAccion.splice(i,1)); rerenderInPlace(); }
function updPlan(i,k,v){ withInforme(inf=>inf.planAccion[i][k]=v); }

function saveInformeFields(){
  withInforme(inf=>{
    inf.resumen = document.getElementById('infResumen').value;
    inf.fortalezas = document.getElementById('infFortalezas').value;
    inf.conclusion = document.getElementById('infConclusion').value;
  });
  toast('Informe guardado');
}

const LOGO_B64 = LOGO_HMH_B64; // compat: uso por defecto (impresión sin establecimiento cargado)

// Logo institucional según a qué establecimiento corresponde el documento.
// Residuos es exclusivo de HMH (siempre ese logo). En RGRL (y en el futuro RAR)
// el establecimiento se elige en el formulario: HMH usa el logo de HMH, todos
// los demás establecimientos (HZT y los CAPs/dependencias que dependen de su
// Área Externa) usan el logo de HZT.
function logoParaAudit(a){
  if(a && a.type==='rgrl'){
    return a.fields.establecimiento==='Hospital María Humphreys' ? LOGO_HMH_B64 : LOGO_HZT_B64;
  }
  return LOGO_HMH_B64;
}

function pHeader(title, code, logo){
  return `<div class="p-header">
    <div class="l"><img src="data:image/png;base64,${logo||LOGO_HMH_B64}" style="height:26px;margin-right:10px"> ${esc(title)}</div>
    <table><tr><td>Documento</td><td>${code}</td></tr><tr><td>Fecha impresión</td><td>${fmtDate(todayISO())}</td></tr></table>
  </div>`;
}
function pTable(headers, rows){
  let h = `<table class="p-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=> h += `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`);
  h += '</tbody></table>';
  return h;
}
function valLabel(v){ return v==='ok'?'Cumple':v==='bad'?'No cumple':v==='na'?'N/A':'—'; }

function doPrint(id){
  const a = getAudit(id);
  const def = FORM_DEFS[a.type];
  const st = computeStats(a);
  let h = `<div class="p-page">`;
  h += pHeader(def.title, def.code, logoParaAudit(a));
  h += `<div class="p-h1">${def.title}</div><div class="p-meta">${def.subtitle}</div>`;
  h += `<div class="p-fields">` + def.fields.map(f=>`<div><b>${f.label}:</b> ${esc(a.fields[f.key]||'—')}</div>`).join('') + `</div>`;
  if(def.tipoPersonal) h += `<div class="p-meta"><b>Tipo de personal auditado:</b> ${a.tipoPersonal||'—'}</div>`;

  if(def.depositos){
    h += `<div class="p-h2">${def.depositos.title}</div>`;
    ['Planta Alta','Planta Baja'].forEach(planta=>{
      const rows = a.depositos.map((d,di)=>({...d,di})).filter(d=>d.planta===planta);
      if(!rows.length) return;
      h += `<div style="font-weight:800; font-size:12px; color:#0D313F; margin:8px 0 4px">${planta}</div>`;
      h += pTable(['Depósito','Limpieza','Horario','Observaciones'], rows.map(d=>[d.nombre+' — '+d.sectores, d.limpieza||'—', d.horario||'—', esc(d.obs||'—')]));
      rows.forEach(d=>{
        const fotos = (a.photos||[]).filter(p=>p.tag==='dep:'+d.di);
        if(fotos.length){
          h += `<div class="p-meta" style="margin:2px 0 8px"><b>Fotos — ${esc(d.nombre)}:</b> ${fotos.map(p=>`<a href="${p.url}">${new Date(p.ts).toLocaleDateString('es-AR')}</a>`).join(' · ')}</div>`;
        }
      });
    });
  }

  def.sections.forEach((sec,si)=>{
    h += `<div class="p-h2">${sec.title}</div>`;
    h += pTable(['Ítem','Resultado','Observación'], sec.items.map((it,ii)=>{
      const cur = a.items[si+'_'+ii];
      return [it, valLabel(cur.v), esc(cur.obs||'')];
    }));
    sec.items.forEach((it,ii)=>{
      const fotos = (a.photos||[]).filter(p=>p.tag==='item:'+si+'_'+ii);
      if(fotos.length){
        h += `<div class="p-meta" style="margin:2px 0 8px"><b>Fotos — ítem ${ii+1} (${esc(sec.title)}):</b> ${fotos.map(p=>`<a href="${p.url}">${new Date(p.ts).toLocaleDateString('es-AR')}</a>`).join(' · ')}</div>`;
      }
    });
  });

  h += `<div class="p-h2">Resultado global</div>`;
  h += pTable(['Cumple','No cumple','N/A','% cumplimiento'], [[st.ok, st.bad, st.na, st.pct===null?'—':st.pct+'%']]);

  h += `<div class="p-h2">Personal presente</div>`;
  const pcols = def.personnel.tipo ? ['Tipo','Nombre','Función','Sector','Capacitado en Gest. Residuos'] : ['Nombre','Función','Sector','Capacitado en Gest. Residuos'];
  h += pTable(pcols, a.personnel.map(p=>{
    const row = [];
    if(def.personnel.tipo) row.push(p.tipo||'—');
    row.push(p.nombre||'—', p.funcion||'—', p.sector||'—', p.capacitado==='si'?'Sí':p.capacitado==='no'?'No':'—');
    return row;
  }));

  const generalPhotosForPdf = (a.photos||[]).filter(p=>!p.tag);
  if(generalPhotosForPdf.length>0){
    h += `<div class="p-h2">Fotos generales (archivadas en Google Drive)</div>`;
    h += pTable(['Fecha', 'Link'], generalPhotosForPdf.map(p=>[new Date(p.ts).toLocaleString('es-AR'), p.url]));
  }

  h += `<div class="p-h2">Firmas</div><div class="p-fields">` + def.firmas.map(f=>`<div><b>${f}</b><br>Firma: _______________ &nbsp; Aclaración: _______________ &nbsp; Fecha: _______</div>`).join('') + `</div>`;

  h += `<div class="p-h2">Referencias</div>`;
  h += pTable(['Símbolo','Significado'], REFERENCIAS.cumplimiento);
  if(def.tipoPersonal) h += pTable(['Tipo','Significado'], REFERENCIAS.tipoPersonal);

  h += `</div>`;
  document.getElementById('printRoot').innerHTML = h;
  setTimeout(()=>window.print(), 80);
}

function doPrintInforme(id){
  const inf = loadInformes().find(i=>i.id===id);
  const agg = computeInformeAgg(inf);
  let h = `<div class="p-page">`;
  h += pHeader('Informe de Auditoría Interna', 'AUD-RES-002');
  h += `<div class="p-h1">Informe de Auditoría Interna</div><div class="p-meta">Gestión de Residuos Hospitalarios — HMH · N.º ${esc(inf.numero||'—')} · Período ${fmtDate(inf.desde)} – ${fmtDate(inf.hasta)}</div>`;

  h += `<div class="p-h2">Resumen ejecutivo</div><div class="p-meta">${esc(inf.resumen)||'—'}</div>`;

  function aggBlock(title, a){
    h += `<div class="p-h2">${title}</div>`;
    h += pTable(['Área','Cumple','No cumple','%'], a.rows.map(r=>{
      const p = (r.ok+r.bad)>0 ? Math.round(r.ok/(r.ok+r.bad)*100) : null;
      return [r.title, r.ok, r.bad, p===null?'—':p+'%'];
    }).concat([[`<b>SUBTOTAL</b>`, a.tot.ok, a.tot.bad, a.pct===null?'—':a.pct+'%']]));
  }
  aggBlock('4.1 Generadores', agg.gen);
  aggBlock('4.2 Operarios de Limpieza — Planta (OPL-P)', agg.mp);
  aggBlock('4.3 Operarios de Limpieza — Empresa (OPL-E)', agg.me);
  aggBlock('4.4 Transporte — Empresa', agg.trans);
  aggBlock('4.5 Auditoría Documental', agg.doc);

  const diff = (agg.mp.pct!==null && agg.me.pct!==null) ? (agg.me.pct-agg.mp.pct) : null;
  h += `<div class="p-h2">4.6 Comparativo Planta vs. Empresa</div>`;
  h += pTable(['Indicador','OPL-P (Planta)','OPL-E (Empresa)','Diferencia'], [['% cumplimiento — operarios de limpieza', agg.mp.pct===null?'—':agg.mp.pct+'%', agg.me.pct===null?'—':agg.me.pct+'%', diff===null?'—':(diff>0?'+':'')+diff+'pp']]);

  h += `<div class="p-h2">Hallazgos y no conformidades</div>`;
  h += pTable(['Entidad','Descripción','Clasif.','Referencia'], inf.hallazgos.map(x=>[x.entidad,esc(x.desc),x.clasif,esc(x.ref)]));

  h += `<div class="p-h2">Plan de acción correctivo</div>`;
  h += pTable(['Entidad','Acción','Responsable','Plazo','Estado'], inf.planAccion.map(x=>[x.entidad,esc(x.accion),esc(x.responsable),esc(x.plazo),x.estado]));

  h += `<div class="p-h2">Conclusión general</div><div class="p-meta">${esc(inf.conclusion)||'—'}</div>`;

  h += `<div class="p-h2">Personal presente en las auditorías del período</div>`;
  let prows = [];
  agg.included.forEach(a=>{
    const def = FORM_DEFS[a.type];
    const entBase = entidadFor(a, def);
    (a.personnel||[]).forEach(p=> prows.push([entBase, p.nombre||'—', p.funcion||'—', p.sector||'—', p.capacitado==='si'?'Sí':p.capacitado==='no'?'No':'—']));
  });
  h += pTable(['Entidad','Nombre','Función','Sector','Capacitado en Gest. Residuos'], prows);

  h += `<div class="p-h2">Firmas</div><div class="p-fields">
    <div><b>Elabora — HySL</b><br>Firma: _______________</div>
    <div><b>Revisa — Comité de Calidad</b><br>Firma: _______________</div>
    <div><b>Recibe — Dirección</b><br>Firma: _______________</div>
    <div><b>Toma conocimiento — Empresa</b><br>Firma: _______________</div>
  </div>`;

  h += `<div class="p-h2">Referencias</div>`;
  h += pTable(['Código','Significado'], REFERENCIAS.entidad);
  h += pTable(['Clasificación','Significado'], REFERENCIAS.clasificacion);
  h += pTable(['Símbolo','Significado'], REFERENCIAS.cumplimiento);

  h += `</div>`;
  document.getElementById('printRoot').innerHTML = h;
  setTimeout(()=>window.print(), 80);
}

// ============ MAIN RENDER ROUTER ============
function render(opts){
  opts = opts || {};
  if(state.view==='home') renderHome();
  else if(state.view==='modulo') renderModulo();
  else if(state.view==='form') renderForm();
  else if(state.view==='informe-new') renderInformeNew();
  else if(state.view==='informe') renderInforme();
  else if(state.view==='tablero') renderTablero();
  if(!opts.preserveScroll) window.scrollTo(0,0);
  bindAutoSave();
}

// Re-render without losing the user's scroll position (for in-place taps: checklist pills, add/remove rows, etc.)
function rerenderInPlace(){
  const y = window.scrollY;
  render({ preserveScroll: true });
  window.scrollTo(0, y);
}

function bindAutoSave(){
  document.querySelectorAll('[data-field],[data-dep],[data-p]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ collectFieldInputs(); });
  });
}

// ============ BÚSQUEDA DE PERSONAL POR DNI (autocompletar + capacitado real) ============
// Fuente única: "Plantilla de registro de Capacitaciones 2026" (planilla operativa
// donde Belén carga todo día a día — NUNCA se escribe en esta planilla desde la app,
// solo se lee).
//   - Personal (nombre/establecimiento/servicio/puesto): pestaña 02_BASE_PERSONAS,
//     que es una fórmula viva (SORT+UNIQUE+FILTER sobre 01_CARGA_UNICA) — siempre
//     está al día, no hace falta sincronizar nada aparte.
//   - Capacitación "Gestión de Residuos Hospitalarios": pestaña 01_CARGA_UNICA
//     (fila por fila, para poder tomar el registro más reciente por persona).
const CAPACITACIONES_WORKBOOK_ID = '1FYCviD31RpbYmuOSQqKFA_JHArY5yfR6K69PRarGP-4';
const TEMA_RESIDUOS = 'Gestión de Residuos Hospitalarios';
let _personalCache = null; // [{dni, nombre, establecimiento, servicio, puesto, tipoVinculo, empresa}]
let _capCache = null;      // [{dni, tema, fecha, aprobo, vencimiento, estado, idRegistro}]

function normDni(v){ return String(v||'').replace(/\D/g,''); }

async function loadPersonalYCapacitaciones(){
  if(_personalCache && _capCache) return;
  await ensureGoogleAuth();
  const [personalRes, capRes] = await Promise.all([
    gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+CAPACITACIONES_WORKBOOK_ID+"/values/'02_BASE_PERSONAS'!A1:G6000"),
    gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+CAPACITACIONES_WORKBOOK_ID+"/values/'01_CARGA_UNICA'!A1:P6000"),
  ]);
  // 02_BASE_PERSONAS tiene filas de título/nota arriba de los datos reales.
  // Identificamos filas de datos reales por tener un DNI numérico de 7+ dígitos en col A.
  const prows = (personalRes.values||[]);
  _personalCache = prows.filter(r=>normDni(r[0]).length>=7).map(r=>({
    dni: normDni(r[0]), nombre: r[1]||'', establecimiento: r[2]||'', servicio: r[3]||'',
    puesto: r[4]||'', tipoVinculo: r[5]||'', empresa: r[6]||'',
  }));
  // 01_CARGA_UNICA también tiene varias filas de título/nota. Identificamos filas de
  // datos reales por ID_REGISTRO con formato "CAP-#####" en col A.
  const crows = (capRes.values||[]);
  _capCache = crows.filter(r=>/^CAP-\d+$/.test(r[0]||'')).map(r=>({
    idRegistro: r[0]||'', fecha: r[1]||'', tema: r[2]||'', dni: normDni(r[3]),
    nombre: r[4]||'', establecimiento: r[5]||'', servicio: r[6]||'', puesto: r[7]||'',
    aprobo: r[11]||'', vencimiento: r[13]||'', estado: r[14]||'',
  }));
}

async function buscarPorDNI(pi){
  collectFieldInputs();
  const a = getAudit(state.auditId);
  const p = a.personnel[pi];
  const dni = normDni(p.dni);
  if(!dni || dni.length<7){ toast('Ingresá un DNI válido antes de buscar.'); return; }
  toast('Buscando...');
  try{
    await loadPersonalYCapacitaciones();
  }catch(e){
    toast('No se pudo conectar con la Plantilla de registro de Capacitaciones. Revisá tu conexión.');
    return;
  }
  const matches = _personalCache.filter(x=>x.dni===dni);
  if(matches.length){
    const m = matches.find(x=>x.establecimiento==='Hospital María Humphreys' || x.establecimiento==='HMH') || matches[0];
    p.nombre = m.nombre; p.sector = m.servicio; p.funcion = m.puesto;
    if(matches.length>1) toast('Encontrado ('+matches.length+' registros con este DNI — se usó el más relevante). Revisá los datos.');
  } else {
    // Respaldo: la persona no está en la Base de Personal (02_BASE_PERSONAS), pero
    // puede tener cargado algún registro de capacitación (de cualquier tema, no solo
    // residuos) con su nombre/establecimiento/servicio/puesto — los usamos igual.
    const anyCap = _capCache.filter(x=>x.dni===dni).sort((x,y)=> (x.fecha<y.fecha?1:-1))[0];
    if(anyCap && anyCap.nombre){
      p.nombre = anyCap.nombre; p.sector = anyCap.servicio; p.funcion = anyCap.puesto;
      toast('No está en la Base de Personal — datos completados desde un registro de capacitación existente. Revisalos.');
    } else {
      toast('DNI no encontrado en la Base de Personal. Cargá los datos a mano.');
    }
  }
  // Capacitación específica: "Gestión de Residuos Hospitalarios" — se toma el
  // registro más reciente por fecha. Se mira APROBO y FECHA_VENCIMIENTO directo,
  // NO el campo ESTADO_REGISTRO: ese campo también marca "REVISAR CAMPOS" cuando
  // falta un dato administrativo (ej. TIPO_VINCULO), sin relación con si la
  // persona aprobó o no — usarlo directo generaría falsos "No capacitado".
  const capRecords = _capCache
    .filter(x=>x.dni===dni && x.tema===TEMA_RESIDUOS)
    .sort((x,y)=> (x.fecha<y.fecha?1:-1)); // más reciente primero
  if(capRecords.length){
    const latest = capRecords[0];
    const aprobo = /^s[ií]$/i.test((latest.aprobo||'').trim());
    const noAplica = /no aplica/i.test(latest.aprobo||'');
    const hoy = todayISO();
    const vencida = latest.vencimiento && latest.vencimiento < hoy;
    const revisarCampos = /REVISAR CAMPOS/i.test(latest.estado||'');
    if(aprobo && !vencida){
      p.capacitado = 'si';
      toast('Capacitado ✓ — Gestión de Residuos Hosp. vigente hasta '+fmtDate(latest.vencimiento)
        +(revisarCampos ? ' — ⚠ este registro tiene datos incompletos en la planilla, verificalo.' : ''));
    } else if(aprobo && vencida){
      p.capacitado = 'no';
      toast('Atención: capacitación vencida el '+fmtDate(latest.vencimiento)+'. Marcado "No".');
    } else if(noAplica || !latest.aprobo){
      p.capacitado = '';
      toast('Hay un registro pero sin resultado de aprobación cargado. Revisalo y completá "Capacitado" a mano.');
    } else {
      p.capacitado = 'no';
      toast('No aprobó la evaluación. Marcado "No".'
        +(revisarCampos ? ' ⚠ este registro además tiene datos incompletos en la planilla.' : ''));
    }
  } else {
    p.capacitado = 'no';
    toast('Sin registro de capacitación en "Gestión de Residuos Hospitalarios". Marcado "No".');
  }
  upsertAudit(a);
  rerenderInPlace();
}

const GOOGLE_CLIENT_ID = '15252479000-aqinu88kbib42ji9efitfnr8pu2mnvql.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
const DRIVE_CONFIG_KEY = 'hmh_drive_config_v1';

let gTokenClient = null;
let gAccessToken = null;
let gTokenExpiry = 0;

function getDriveConfig(){ try{ return JSON.parse(localStorage.getItem(DRIVE_CONFIG_KEY)) || null; }catch(e){ return null; } }
function saveDriveConfig(cfg){ localStorage.setItem(DRIVE_CONFIG_KEY, JSON.stringify(cfg)); }

function gLoadTokenClient(){
  if(gTokenClient) return;
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPES,
    callback: () => {},
  });
}

function ensureGoogleAuth(){
  return new Promise((resolve, reject)=>{
    if(gAccessToken && Date.now() < gTokenExpiry - 30000){ resolve(gAccessToken); return; }
    if(typeof google === 'undefined' || !google.accounts){ reject(new Error('No se pudo cargar Google (revisá tu conexión a internet).')); return; }
    gLoadTokenClient();
    gTokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      gAccessToken = resp.access_token;
      gTokenExpiry = Date.now() + (resp.expires_in*1000);
      resolve(gAccessToken);
    };
    gTokenClient.requestAccessToken({ prompt: gAccessToken ? '' : 'consent' });
  });
}

async function gFetch(url, opts){
  opts = opts || {};
  const token = await ensureGoogleAuth();
  const headers = Object.assign({ 'Authorization': 'Bearer '+token }, opts.headers||{});
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if(!res.ok){ const t = await res.text(); throw new Error('Google API error '+res.status+': '+t); }
  return res.json();
}

async function findExistingDriveFile(name, mimeType){
  // Busca en Drive un archivo/carpeta no papelera con este nombre exacto, para evitar
  // crear duplicados si la config local (localStorage) se perdió (otro dispositivo,
  // caché borrada, reinstalación de la app, etc.). Devuelve el más antiguo si hay más de uno.
  const q = `name = '${name.replace(/'/g, "\\'")}' and mimeType = '${mimeType}' and trashed = false`;
  const res = await gFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&orderBy=createdTime&fields=files(id,name,createdTime)&pageSize=10');
  return (res.files && res.files.length) ? res.files[0] : null;
}

// Código de entidad (G / OPL-P / OPL-E / T) para cruzar auditorías con el Informe-002
function entidadFor(a, def){
  if(a.type==='gen') return 'G';
  if(a.type==='trans') return 'T';
  if(a.type==='doc') return 'DOC';
  if(a.type==='rgrl' || a.type==='incendios') return a.fields.establecimiento || def.code;
  return a.tipoPersonal==='E' ? 'OPL-E' : 'OPL-P';
}

let _sheetTabsEnsured = false;
async function ensureSheetTabs(sheetId){
  if(_sheetTabsEnsured) return;
  const meta = await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'?fields=sheets.properties.title');
  const existing = new Set((meta.sheets||[]).map(s=>s.properties.title));
  const missing = Object.keys(SHEET_TABS).filter(t=>!existing.has(t));
  if(missing.length){
    await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+':batchUpdate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ requests: missing.map(title=>({ addSheet: { properties: { title } } })) }),
    });
    for(const title of missing){
      await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(title)+'!A1:append?valueInputOption=USER_ENTERED', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ values: [SHEET_TABS[title]] }),
      });
    }
  }
  // Pestaña "Tablero" con fórmulas — se crea una sola vez; si ya existe no se toca
  // (por si Belén la personalizó a mano).
  if(!existing.has('Tablero')){
    await ensureTableroTab(sheetId);

  _sheetTabsEnsured = true;

          range: { sheetId: tabSheetId, startRowIndex: sectionRowDE, endRowIndex: sectionRowDE+1, startColumnIndex: 0, endColumnIndex: 5 },
          cell: { userEnteredFormat: { textFormat: { bold: true }, backgroundColor: {red:0.937,green:0.949,blue:0.957} } },
          fields: 'userEnteredFormat(textFormat,backgroundColor)',
        }
      },
      { updateSheetProperties: { properties: { sheetId: tabSheetId, gridProperties: { frozenRows: 0 } }, fields: 'gridProperties.frozenRows' } },
    ] }),
  });
}

// ID fijo de la ÚNICA planilla de Tablero real (dueña: belunchyy444@gmail.com,
// compartida como Editor con hysl.hmh@gmail.com). Se usa siempre este ID en vez de
// buscar por nombre, porque la búsqueda por nombre generó archivos duplicados en
// más de una ocasión (delays de indexación de Drive entre cuentas).
const CANONICAL_SHEET_ID = '1nO1qt6yGzptlXmh_TmixK9izjPXF5FhibHznK1RjY8k';

async function ensureDriveSetup(){
  let cfg = getDriveConfig();
  if(cfg && cfg.folderId && cfg.sheetId === CANONICAL_SHEET_ID){
    await ensureSheetTabs(cfg.sheetId);
    return cfg;
  }

  // Config local perdida, o apuntando a un ID viejo/incorrecto: se reconstruye,
  // pero el sheetId SIEMPRE es el fijo — nunca se busca por nombre ni se crea uno nuevo.
  toast('Conectando con la planilla institucional...');
  let folder = await findExistingDriveFile('Fotos Auditorías HMH', 'application/vnd.google-apps.folder');
  let sheetId = CANONICAL_SHEET_ID;

  if(!folder){
    toast('Configurando carpeta de fotos por primera vez...');
    folder = await gFetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name:'Fotos Auditorías HMH', mimeType:'application/vnd.google-apps.folder' }),
    });
  }
  await ensureSheetTabs(sheetId);

  cfg = { folderId: folder.id, sheetId: sheetId, sheetUrl: 'https://docs.google.com/spreadsheets/d/'+sheetId+'/edit' };
  saveDriveConfig(cfg);
  toast('Drive conectado ✓');
  return cfg;
}

async function syncAuditToSheet(auditId){
  const a = getAudit(auditId);
  if(!a.confirmed){
    toast('Primero tocá "Guardar" para confirmar la auditoría, después sincronizá.');
    return;
  }
  const def = FORM_DEFS[a.type];
  try {
    const cfg = await ensureDriveSetup();
    const st = computeStats(a);
    const label = a.fields.servicio || a.fields.empresa || def.title;
    const now = new Date().toLocaleString('es-AR');
    const entidad = entidadFor(a, def);
    const numero = a.fields.numero;

    const row = [numero, def.code, entidad, fmtDate(a.fields.fecha), label, a.tipoPersonal||'', a.fields.auditor||'', st.ok, st.bad, st.na, st.pct===null?'':st.pct, now];

    const detailRows = [];
    def.sections.forEach((sec,si)=> sec.items.forEach((it,ii)=>{
      const cur = a.items[si+'_'+ii];
      if(cur.v) detailRows.push([numero, def.code, entidad, fmtDate(a.fields.fecha), sec.title, it, valLabel(cur.v), cur.obs||'', now]);
    }));

    const personnelRows = (a.personnel||[]).filter(p=>p.nombre).map(p=>[
      numero, def.code, fmtDate(a.fields.fecha), p.tipo||'', p.nombre||'', p.funcion||'', p.sector||'',
      p.capacitado==='si'?'Sí':p.capacitado==='no'?'No':'', now
    ]);

    const depositoRows = (def.depositos && a.depositos) ? a.depositos.map(d=>[
      numero, fmtDate(a.fields.fecha), d.planta||'', d.nombre, d.sectores,
      d.limpieza==='si'?'Sí':d.limpieza==='no'?'No':'', d.horario==='si'?'Sí':d.horario==='no'?'No':'', d.obs||'', now
    ]) : [];

    // Re-sincronizar la misma auditoría reemplaza sus filas anteriores en cada pestaña
    // (en vez de duplicarlas), buscando por N.º de auditoría en la columna A.
    await replaceAuditRowsInTab(cfg, 'Resumen', numero, [row]);
    await replaceAuditRowsInTab(cfg, 'Detalle', numero, detailRows);
    await replaceAuditRowsInTab(cfg, 'Personal', numero, personnelRows);
    if(def.depositos) await replaceAuditRowsInTab(cfg, 'Depositos', numero, depositoRows);

    a.lastSync = Date.now();
    upsertAudit(a);
    toast('Sincronizado con Drive ✓');
    rerenderInPlace();
  } catch(e){
    console.error(e);
    toast('No se pudo sincronizar — '+(e && e.message ? e.message.slice(0,160) : 'error desconocido'));
  }
}

// Reemplaza, dentro de una pestaña, todas las filas de una auditoría (identificada por
// N.º en la columna A) por las filas nuevas — así sincronizar dos veces la misma
// auditoría actualiza en vez de duplicar. Trae todo lo existente, saca las filas de
// este N.º, agrega las nuevas al final, y reescribe la pestaña completa (desde la fila 2).
async function replaceAuditRowsInTab(cfg, tabName, numero, newRows){
  const range = encodeURIComponent(tabName) + '!A2:Z5000';
  const res = await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+'/values/'+range);
  const existing = (res.values || []).filter(r => r[0] !== numero);
  const combined = existing.concat(newRows);
  await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+'/values/'+range+':clear', { method:'POST' });
  if(combined.length){
    await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+'/values/'+encodeURIComponent(tabName)+'!A2?valueInputOption=USER_ENTERED', {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ values: combined }),
    });
  }
}

function slugify(text){
  return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'sf';
}

// Etiqueta legible (sector/tipo) a partir del tag de la foto, para nombre de archivo y trazabilidad
function photoLabelFromTag(a, def, tag){
  if(!tag) return a.fields.servicio || a.fields.empresa || def.title;
  if(tag.startsWith('dep:')){
    const di = +tag.slice(4);
    const dep = a.depositos && a.depositos[di];
    return dep ? dep.nombre : 'deposito';
  }
  if(tag.startsWith('item:')){
    const [si] = tag.slice(5).split('_').map(Number);
    const sec = def.sections[si];
    return sec ? sec.title : 'item';
  }
  return a.fields.servicio || a.fields.empresa || def.title;
}

async function uploadPhotoToDrive(auditId, file, tag){
  const cfg = await ensureDriveSetup();
  const a = getAudit(auditId);
  const def = FORM_DEFS[a.type];
  const label = photoLabelFromTag(a, def, tag);
  const numero = a.fields.numero || 's-n';
  const fechaSlug = (a.fields.fecha || todayISO());
  const seq = ((a.photos||[]).length + 1);
  const fname = def.code+'_'+numero+'_'+slugify(label)+'_'+fechaSlug+'_'+String(seq).padStart(2,'0')+'.jpg';
  const metadata = { name: fname, parents: [cfg.folderId] };
  const boundary = 'hmhbound'+Date.now();
  const metaPart = '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n';
  const filePartHeader = '--'+boundary+'\r\nContent-Type: '+(file.type||'image/jpeg')+'\r\n\r\n';
  const closing = '\r\n--'+boundary+'--';
  const fileBuf = await file.arrayBuffer();
  const encoder = new TextEncoder();
  const body = new Blob([encoder.encode(metaPart), encoder.encode(filePartHeader), fileBuf, encoder.encode(closing)]);
  const token = await ensureGoogleAuth();
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
    method:'POST',
    headers: { 'Authorization':'Bearer '+token, 'Content-Type': 'multipart/related; boundary='+boundary },
    body: body,
  });
  if(!res.ok){ throw new Error('Error subiendo foto: '+res.status); }
  const json = await res.json();
  try {
    await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+'/values/Fotos!A1:append?valueInputOption=USER_ENTERED', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ values:[[numero, new Date().toLocaleString('es-AR'), label, metadata.name, json.webViewLink]] }),
    });
  } catch(e){ /* no bloquea si falla el log */ }
  return json;
}

async function handlePhotoInput(auditId, inputEl, tag){
  const file = inputEl.files[0];
  if(!file) return;
  const a0 = getAudit(auditId);
  if(!a0.confirmed){
    toast('Primero tocá "Guardar" para confirmar la auditoría, después subí fotos.');
    inputEl.value = '';
    return;
  }
  toast('Subiendo foto a Drive...');
  try {
    const result = await uploadPhotoToDrive(auditId, file, tag);
    const a = getAudit(auditId);
    a.photos = a.photos || [];
    a.photos.push({ id: result.id, url: result.webViewLink, ts: Date.now(), tag: tag || null });
    upsertAudit(a);
    toast('Foto subida a Drive ✓');
    rerenderInPlace();
  } catch(e){
    console.error(e);
    toast('Error al subir la foto. Probá de nuevo.');
  }
  inputEl.value = '';
}

function removePhoto(auditId, idx){
  if(!confirm('¿Quitar esta foto de la lista? (la foto en Drive no se borra)')) return;
  const a = getAudit(auditId);
  a.photos.splice(idx,1);
  upsertAudit(a);
  rerenderInPlace();
}

// Borra la pestaña "Tablero" (si existe) y la recrea desde cero con el
// layout/fórmulas actuales de la app. A diferencia de la primera creación
// automática (que solo pasa una vez, para no pisar personalizaciones a
// mano sin avisar), esto es una acción explícita que la usuaria dispara
// a propósito -- por eso pide confirmación primero.
async function regenerarTablero(){
  const confirmado = confirm('Esto borra la pestaña "Tablero" actual del Sheet y la recrea con las fórmulas más recientes de la app.\n\nSi hiciste cambios a mano en esa pestaña, se van a perder.\n\n¿Continuar?');
  if(!confirmado) return;
  toast('Regenerando Tablero...');
  try {
    const cfg = await ensureDriveSetup();
    const meta = await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+'?fields=sheets.properties');
    const tabActual = (meta.sheets||[]).find(s=>s.properties.title==='Tablero');
    if(tabActual){
      await gFetch('https://sheets.googleapis.com/v4/spreadsheets/'+cfg.sheetId+':batchUpdate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ requests: [{ deleteSheet: { sheetId: tabActual.properties.sheetId } }] }),
      });
    }
    await ensureTableroTab(cfg.sheetId);
    toast('Tablero regenerado ✓');
  } catch(e){
    console.error(e);
    toast('No se pudo regenerar — '+(e && e.message ? e.message.slice(0,160) : 'error desconocido'));
  }
}
